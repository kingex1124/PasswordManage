<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <meta name="theme-color" content="#2563eb" />
    <title>密碼管理</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="./images/192.png" />
    <link rel="apple-touch-icon" href="./images/192.png" />
    <link rel="stylesheet" href="./styles.css?v=2026022801" />
  </head>
  <body>
    <div class="app-container">
      <header class="toolbar">
        <div class="toolbar-brand">
          <h1>
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            密碼管理
          </h1>
          <button id="installAppBtn" type="button" hidden>安裝 App</button>
        </div>
        <div class="toolbar-actions">
          <button id="addRecordBtn" type="button">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            新增資料
          </button>
          <button id="importBtn" type="button">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            匯入加密檔
          </button>
          <button id="saveBtn" type="button">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
              ></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            存檔
          </button>
          <button id="changeArchivePasswordBtn" type="button">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"
              ></path>
            </svg>
            變更存檔密碼
          </button>
          <span id="archivePasswordAgeText" class="toolbar-status" aria-live="polite">
            尚未建立存檔密碼
          </span>
        </div>
      </header>

      <main>
        <section class="card filters">
          <label>
            類別篩選
            <select id="categoryFilter"></select>
          </label>
          <label>
            種類篩選
            <select id="typeFilter"></select>
          </label>
          <label>
            帳號或備註關鍵字
            <input id="accountKeyword" type="text" placeholder="輸入帳號或備註關鍵字" />
          </label>
        </section>

        <div id="messageArea" class="message" role="status" aria-live="polite">
          <span id="messageText"></span>
          <button id="messageCloseBtn" type="button" class="message-close-btn" aria-label="關閉通知">
            ×
          </button>
        </div>

        <section class="card master-panel">
          <div class="master-panel-head">
            <h2>主檔維護</h2>
            <button id="toggleMasterBtn" type="button">收合</button>
          </div>
          <div id="masterPanelBody">
            <section class="master-section">
              <div class="master-block">
                <div class="master-head">
                  <h2>類別維護</h2>
                  <button
                    id="addCategoryBtn"
                    type="button"
                    class="icon-btn"
                    title="新增類別"
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                  </button>
                </div>
                <div class="table-container">
                  <table>
                    <thead>
                      <tr>
                        <th class="th-col-seq">流水號</th>
                        <th>名稱</th>
                        <th class="th-col-actions">操作</th>
                      </tr>
                    </thead>
                    <tbody id="categoryMasterBody"></tbody>
                  </table>
                </div>
              </div>

              <div class="master-block">
                <div class="master-head">
                  <h2 id="typeBlockTitle">種類維護</h2>
                  <button
                    id="addTypeBtn"
                    type="button"
                    class="icon-btn"
                    title="新增種類"
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                  </button>
                </div>
                <p id="typeBlockHint" class="master-hint"></p>
                <div class="table-container">
                  <table>
                    <thead>
                      <tr>
                        <th class="th-col-seq">流水號</th>
                        <th>名稱</th>
                        <th class="th-col-actions">操作</th>
                      </tr>
                    </thead>
                    <tbody id="typeMasterBody"></tbody>
                  </table>
                </div>
              </div>
            </section>
          </div>
        </section>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th id="categorySortHeader" class="sortable-header" title="點擊排序">類別</th>
                <th id="typeSortHeader" class="sortable-header" title="點擊排序">種類</th>
                <th>帳號</th>
                <th>密碼歷程</th>
                <th>備註</th>
                <th class="th-col-actions">操作</th>
              </tr>
            </thead>
            <tbody id="recordTableBody"></tbody>
          </table>
        </div>
      </main>
    </div>

    <dialog id="recordModal">
      <form id="recordForm" method="dialog">
        <div class="modal-header">
          <h2 id="recordModalTitle">新增資料</h2>
        </div>
        <div class="modal-body">
          <input id="recordId" type="hidden" />

          <div class="flex-row">
            <label>
              類別
              <select id="categoryInput" required></select>
            </label>
            <label>
              種類
              <select id="typeInput" required></select>
            </label>
          </div>
          <label>
            帳號
            <input id="accountInput" type="text" required />
          </label>

          <div>
            <div class="history-head">
              <span>密碼歷程</span>
              <button
                id="addPasswordHistoryBtn"
                type="button"
                class="icon-btn"
                title="新增密碼歷程"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                新增
              </button>
            </div>
            <div id="passwordHistoryEditor" class="history-editor"></div>
          </div>

          <label>
            備註
            <textarea id="noteInput" rows="4"></textarea>
          </label>
        </div>

        <div class="modal-actions">
          <button id="cancelModalBtn" type="button">取消</button>
          <button id="saveRecordBtn" type="submit">儲存</button>
        </div>
      </form>
    </dialog>

    <input id="fileInput" type="file" accept=".json,application/json" hidden />

    <dialog id="passwordDialog">
      <form id="passwordDialogForm" method="dialog">
        <div class="modal-header">
          <h2 id="passwordDialogTitle">輸入密碼</h2>
        </div>
        <div class="modal-body">
          <p id="passwordDialogMessage" class="dialog-message"></p>
          <div class="password-input-row">
            <input id="passwordDialogInput" type="password" />
            <button
              id="togglePasswordDialogBtn"
              type="button"
              class="icon-btn"
              title="顯示/隱藏密碼"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <div class="modal-actions">
          <button id="cancelPasswordDialogBtn" type="button">取消</button>
          <button id="confirmPasswordDialogBtn" type="submit">確認</button>
        </div>
      </form>
    </dialog>

    <dialog id="masterEditDialog">
      <form id="masterEditForm" method="dialog">
        <div class="modal-header">
          <h2 id="masterEditTitle">編輯主檔</h2>
        </div>
        <div class="modal-body">
          <label>
            名稱
            <input id="masterEditNameInput" type="text" required />
          </label>
          <label>
            流水號
            <input id="masterEditSeqInput" type="number" min="1" step="1" required />
          </label>
        </div>
        <div class="modal-actions">
          <button id="cancelMasterEditBtn" type="button">取消</button>
          <button id="confirmMasterEditBtn" type="submit">儲存</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./src/main.js?v=2026022801"></script>
  </body>
</html>
